name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    timeout-minutes: 90
    env:
      MYHKU_MAC_NOTARIZE: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 != '' && '1' || '0' }}
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check selected macOS signing mode
        if: runner.os == 'macOS'
        run: npm run check:macos-signing
        env:
          CSC_LINK: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MYHKU_MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MYHKU_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MYHKU_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MYHKU_APPLE_TEAM_ID }}
      - run: npm ci
      - run: npm run test:macos-release
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run desktop:package -- --win --x64 --publish never
        env: { MYHKU_RELEASE_DIR: release/desktop }
      - name: Package macOS (ad-hoc by default; notarized when configured)
        if: runner.os == 'macOS'
        run: npm run desktop:package -- --mac --arm64 --publish never
        env:
          MYHKU_RELEASE_DIR: release/desktop
          CSC_LINK: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MYHKU_MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MYHKU_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MYHKU_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MYHKU_APPLE_TEAM_ID }}
      - name: Verify final macOS download integrity
        if: runner.os == 'macOS'
        run: npm run verify:macos-release -- release/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/alpha*.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npm run build
      - name: Prepare Android signing key
        if: ${{ env.MYHKU_ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$MYHKU_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myhku-release.jks"
        env:
          MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
      - run: ./gradlew :app:bundleRelease :app:assembleRelease
        working-directory: android
        env:
          MYHKU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myhku-release.jks
          MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
          MYHKU_ANDROID_KEY_ALIAS: ${{ secrets.MYHKU_ANDROID_KEY_ALIAS }}
          MYHKU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEYSTORE_PASSWORD }}
          MYHKU_ANDROID_KEY_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEY_PASSWORD }}
      - name: Build installable test APK when no release key is configured
        if: ${{ env.MYHKU_ANDROID_KEYSTORE_BASE64 == '' }}
        run: ./gradlew :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }
      - name: Create checksums for the final downloadable files
        working-directory: release
        run: |
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file")
            printf '%s  %s\n' "${hash%% *}" "${file##*/}"
          done > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            安装前请阅读 [README 各设备安装指南](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#各设备安装指南)。

            - Windows x64：推荐 `MyHKU.Setup.<版本>.exe`；另有免安装 EXE。
            - Mac Apple Silicon：下载 arm64 DMG 或 ZIP，移入 Applications。未公证版本首次打开的系统提示处理方法见安装指南。
            - Android 8.0+：优先选择 `app-release.apk`；未配置发行签名时提供可直接安装的测试版 `app-debug.apk`。`app-release-unsigned.apk` 需自行签名，AAB 不能直接安装。
            - `SHA256SUMS.txt` 可用于核对下载完整性。
          files: |
            release/**
