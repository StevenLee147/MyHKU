name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional v<package version> tag to publish after all builds and installation checks pass'
        required: false
        type: string

permissions:
  contents: write

jobs:
  desktop:
    timeout-minutes: 90
    env:
      MYHKU_MAC_NOTARIZE: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 != '' && '1' || '0' }}
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check selected macOS signing mode
        if: runner.os == 'macOS'
        run: npm run check:macos-signing
        env:
          CSC_LINK: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MYHKU_MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MYHKU_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MYHKU_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MYHKU_APPLE_TEAM_ID }}
      - run: npm ci
      - run: npm run test:macos-release
      - name: Verify desktop login flows
        run: npm run test:desktop-auth
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run desktop:package -- --win --x64 --publish never
        env: { MYHKU_RELEASE_DIR: release/desktop }
      - name: Package macOS (ad-hoc by default; notarized when configured)
        if: runner.os == 'macOS'
        run: npm run desktop:package -- --mac --arm64 --publish never
        env:
          MYHKU_RELEASE_DIR: release/desktop
          CSC_LINK: ${{ secrets.MYHKU_MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MYHKU_MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MYHKU_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MYHKU_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MYHKU_APPLE_TEAM_ID }}
      - name: Verify final macOS download integrity
        if: runner.os == 'macOS'
        run: npm run verify:macos-release -- release/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/alpha*.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
      MYHKU_ANDROID_KEY_ALIAS: ${{ secrets.MYHKU_ANDROID_KEY_ALIAS }}
      MYHKU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEYSTORE_PASSWORD }}
      MYHKU_ANDROID_KEY_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Validate explicitly requested release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const expected = "v" + JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.RELEASE_TAG !== expected) throw new Error("Release tag must match package.json: " + expected);'
      - run: node --test scripts/verify-android-release.test.mjs
      - name: Prepare Android signing key
        run: |
          if [[ -z "$MYHKU_ANDROID_KEYSTORE_BASE64" || -z "$MYHKU_ANDROID_KEY_ALIAS" || -z "$MYHKU_ANDROID_KEYSTORE_PASSWORD" || -z "$MYHKU_ANDROID_KEY_PASSWORD" ]]; then
            echo "Android release signing credentials are required; unsigned APKs will not be published." >&2
            exit 1
          fi
          umask 077
          keystore_path="$RUNNER_TEMP/myhku-release.jks"
          printf '%s' "$MYHKU_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          printf 'MYHKU_ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"
      - name: Build an older signed APK for upgrade verification
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease -PmyhkuVersionCode=3 -PmyhkuVersionName=0.1.3-alpha
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/android-upgrade-baseline.apk
      - run: ./gradlew :app:bundleRelease :app:assembleRelease
        working-directory: android
      - name: Verify Android release identity, signatures and alignment
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/app-release.apk release/android/
          cp android/app/build/outputs/bundle/release/app-release.aab release/android/
          node scripts/verify-android-release.mjs release/android/app-release.apk release/android/app-release.aab 4
          cp android/release-certificate.sha256 release/android/ANDROID-SIGNING-CERTIFICATE.sha256
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, upgrade and launch on Android 8.0
        id: android26
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-install-smoke.sh release/android/app-release.apk release/android-upgrade-baseline.apk 4 26
      - name: Install, upgrade and launch on Android 15
        id: android35
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-install-smoke.sh release/android/app-release.apk release/android-upgrade-baseline.apk 4 35
      - name: Require both Android installation checks to pass
        if: steps.android26.outcome != 'success' || steps.android35.outcome != 'success'
        run: exit 1
      - name: Preserve Android installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-install-diagnostics
          path: release/android-install-diagnostics/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            release/android/app-release.apk
            release/android/app-release.aab
            release/android/ANDROID-SIGNING-CERTIFICATE.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '{desktop-*,android}'
      - name: Create checksums for the final downloadable files
        working-directory: release
        run: |
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file")
            printf '%s  %s\n' "${hash%% *}" "${file##*/}"
          done > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          body: |
            最新安装包见 [README 下载与设备对应](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/README.md#下载与设备对应)；安装前请阅读 [各设备安装指南](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/README.md#各设备安装指南)。

            - Windows x64：推荐 `MyHKU.Setup.<版本>.exe`；另有免安装 EXE。
            - Mac Apple Silicon：下载 arm64 DMG 或 ZIP，移入 Applications。未公证版本首次打开的系统提示处理方法见安装指南。
            - Android 8.0+：下载固定签名的 `app-release.apk`；AAB 仅用于分发，不能直接安装。发布前检查签名并验证安装、覆盖升级和启动，不再发布未签名 APK。
            - `SHA256SUMS.txt` 可用于核对下载完整性。
          files: |
            release/**

  update-downloads:
    needs: publish
    uses: ./.github/workflows/update-downloads.yml
    permissions:
      contents: write
