name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix: { os: [windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run desktop:package -- --publish never
        env: { MYHKU_RELEASE_DIR: release/desktop }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/alpha*.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
      - run: npm run build
      - name: Prepare Android signing key
        if: ${{ env.MYHKU_ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$MYHKU_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/myhku-release.jks"
        env:
          MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
      - run: ./gradlew :app:bundleRelease :app:assembleRelease
        working-directory: android
        env:
          MYHKU_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/myhku-release.jks
          MYHKU_ANDROID_KEYSTORE_BASE64: ${{ secrets.MYHKU_ANDROID_KEYSTORE_BASE64 }}
          MYHKU_ANDROID_KEY_ALIAS: ${{ secrets.MYHKU_ANDROID_KEY_ALIAS }}
          MYHKU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEYSTORE_PASSWORD }}
          MYHKU_ANDROID_KEY_PASSWORD: ${{ secrets.MYHKU_ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }
      - run: cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/**
            release/SHA256SUMS.txt
