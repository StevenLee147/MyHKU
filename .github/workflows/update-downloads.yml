name: Update README downloads

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify README updater
        run: node --test scripts/update-readme-downloads.test.mjs
      - name: Update downloads and repair release documentation links
        run: node scripts/update-readme-downloads.mjs --sync-release-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README downloads are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest release downloads"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
